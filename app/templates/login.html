{% extends "base.html" %}
{% block title %}Log in · LeftoverEat{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Log in</h1>
  {% if form_error %}<p class="flash bad" role="alert">{{ form_error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>Email <input type="email" name="email" value="{{ email }}" required autocomplete="email"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="/register">Create an account</a>.</p>
</section>
{% endblock %}
